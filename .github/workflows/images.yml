# Build the three Foxguard images and publish them to the GitHub Container
# Registry.
#
# GHCR needs no account beyond the repository's own: GITHUB_TOKEN, with
# `packages: write`, is the credential. Images land at
# ghcr.io/<owner>/foxguard-{api,dashboard,gateway} and are private until the
# package's settings are switched to public -- a one-time click per image, under
# the repository's Packages tab. A public package needs no login to pull, which
# is what makes `docker compose up` work on a fresh gateway.
#
# Pull requests build but never push: a fork must not be able to publish an
# image under this owner's name.

name: images

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  # A second push to the same branch makes the first build irrelevant.
  group: images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            dockerfile: docker/api.Dockerfile
          - name: dashboard
            dockerfile: docker/dashboard.Dockerfile
          - name: gateway
            dockerfile: docker/gateway.Dockerfile

    steps:
      - uses: actions/checkout@v4

      # GHCR rejects an uppercase path, and GitHub usernames are not
      # necessarily lowercase. github.repository_owner is used verbatim
      # everywhere else, so normalise it once here.
      - name: Work out the image name
        id: image
        run: |
          owner=$(printf '%s' "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          printf 'ref=ghcr.io/%s/foxguard-%s\n' "$owner" "${{ matrix.name }}" >> "$GITHUB_OUTPUT"

      # arm64 through QEMU. It is slow -- the Next.js build especially -- but it
      # is what puts these images on the small ARM boxes people actually run a
      # home gateway on.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.ref }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=ref,event=pr
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=foxguard-${{ matrix.name }}
            org.opencontainers.image.description=Foxguard ${{ matrix.name }}: WireGuard access control with an nftables dataplane
            org.opencontainers.image.licenses=${{ github.event.repository.license.spdx_id }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
