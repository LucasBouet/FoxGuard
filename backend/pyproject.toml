[project]
name = "foxguard-backend"
version = "0.1.0"
description = "Foxguard control plane: WireGuard access control with an nftables dataplane"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.30",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "argon2-cffi>=23.1",
    "pyotp>=2.9",
    # OIDC id_token verification. joserfc rather than authlib.jose, which its
    # own author deprecated in favour of this; it also makes the accepted
    # signature algorithms an explicit argument rather than a default.
    "joserfc>=1.0",
    "httpx>=0.27",
]

[project.scripts]
# Runs uvicorn with proxy headers disabled. See foxguard/server.py: with them on
# (uvicorn's default) the portal's source-address identity can be forged.
foxguard-serve = "foxguard.server:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "httpx>=0.27",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["foxguard*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["error::DeprecationWarning:foxguard.*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "S"]
ignore = [
    "E501",   # long lines are handled by the formatter
    "B008",   # FastAPI's Depends() in defaults is the documented idiom
    # str+Enum rather than StrEnum on purpose: these enums are persisted as
    # native PostgreSQL enums and rendered into nft scripts, so `.value` is
    # always used explicitly and StrEnum's implicit str() would hide mistakes.
    "UP042",
]

[tool.ruff.lint.per-file-ignores]
# assert is the point; random is for shuffling; the credentials in the portal
# tests are hardcoded on purpose -- that is what makes them fixtures.
"tests/*" = ["S101", "S311", "S105", "S106"]
"alembic/versions/*" = ["E402"]
