# Foxguard generated dnsmasq configuration -- DO NOT EDIT BY HAND.
#
# Written by foxguard-agent on every reconciliation; an edit here survives
# until the next poll.
#
# This file configures Foxguard's *own* dnsmasq instance, started by
# foxguard-dns.service. It deliberately does not read /etc/dnsmasq.d, so the
# host's resolver and this one cannot interfere with each other.
#
port=53

# Answer only where Foxguard is reachable. Binding every interface
# would publish an open resolver on the WAN.
listen-address=10.88.0.1
listen-address=fd00:88::1
bind-interfaces

# Foxguard's records only: never /etc/hosts, never /etc/dnsmasq.d.
no-hosts
addn-hosts=/etc/foxguard/dns/hosts
no-poll

domain=fox.internal
# Authoritative for the zone: these names are never asked upstream.
local=/fox.internal/
local=/0.88.10.in-addr.arpa/
local=/0.0.0.0.0.0.0.0.8.8.0.0.0.0.d.f.ip6.arpa/

# Forwarding resolver: the fleet's queries leave through these.
no-resolv
server=1.1.1.1
server=9.9.9.9
domain-needed
bogus-priv

# Aliases. dnsmasq resolves these against its own records.
cname=files.fox.internal,backup.fox.internal
cname=portal.fox.internal,gw.fox.internal

cache-size=1000
